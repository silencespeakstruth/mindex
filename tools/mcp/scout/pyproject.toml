[project]
name = "scout"
version = "1.0.0"
description = "MCP server that delegates codebase investigation to a local model and returns a cited report."
authors = [{ name = "Сергей Боголюбов" }]
license = "MIT"
keywords = ["mcp", "code-search", "rag", "agent", "mindex"]
requires-python = ">=3.13,<3.14"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/silencespeakstruth/mindex"

[project.scripts]
scout = "scout.server:main"

[tool.poetry]
packages = [{ include = "scout", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

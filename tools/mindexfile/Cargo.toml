[package]
name        = "mindexfile"
version     = "2.0.0"
edition     = "2024"
authors     = ["Сергей Боголюбов"]
license     = "MIT"
repository  = "https://github.com/silencespeakstruth/mindex"
description = "The file formats every Rust mindex client shares: the .mindex project marker and the per-server credentials file."
keywords    = ["code-search", "config", "glob", "yaml", "mindex"]
categories  = ["development-tools", "config"]

[dependencies]
anyhow        = "1"
base64        = "0.22"
globset       = "0.4"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
serde_yaml_ng = "0.10"
toml          = "0.9"
uuid          = "1"

[dev-dependencies]
tempfile = "3"

<!-- Marketplace / extensions-list icon, rendered to media/icon.png at 128px.
     Same mark as the activity bar, filled and set on a deep gradient tile so it
     stays legible against both light and dark extension lists.

     Note: the ink is flat white, not a gradient. A vertical objectBoundingBox
     gradient collapses on a horizontal line (zero-height bbox) and the strata
     silently vanish — which is exactly what the first cut of this file did. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.5" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#tile)"/>

  <!-- strata: the index -->
  <g stroke="#ffffff" stroke-width="7.5" stroke-linecap="round">
    <path d="M23 40h44" opacity=".95"/>
    <path d="M23 64h30" opacity=".72"/>
    <path d="M23 88h39" opacity=".5"/>
  </g>

  <!-- constellation: the semantic graph over them -->
  <g opacity=".97">
    <path d="M88 36 106 64 78 84Z" fill="none" stroke="#ffffff"
          stroke-width="5.5" stroke-linejoin="round" opacity=".85"/>
    <circle cx="88" cy="36" r="8.5" fill="#ffffff"/>
    <circle cx="106" cy="64" r="7" fill="#ffffff"/>
    <circle cx="78" cy="84" r="7" fill="#ffffff"/>
  </g>
</svg>

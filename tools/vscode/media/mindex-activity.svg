<!-- Activity-bar icon: monochrome, inherits the bar's foreground colour.
     The mark is the product in one glyph — stacked strata (the index) with a
     three-node constellation over them (the semantic graph the vectors form). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- strata -->
  <path d="M3.5 7.5h9" opacity=".9"/>
  <path d="M3.5 12h6.5" opacity=".65"/>
  <path d="M3.5 16.5h9.5" opacity=".45"/>
  <!-- constellation -->
  <path d="M16.5 6.2 20.2 11.2 14.4 14.9Z" opacity=".95"/>
  <circle cx="16.5" cy="6.2" r="1.7" fill="currentColor" stroke="none"/>
  <circle cx="20.2" cy="11.2" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="14.4" cy="14.9" r="1.5" fill="currentColor" stroke="none"/>
</svg>

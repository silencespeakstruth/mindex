# mindex-index (indexer CLI) configuration (example).
#
# Copy to $XDG_CONFIG_HOME/mindex/indexer.toml (defaults to
# ~/.config/mindex/indexer.toml), or point at it with `--config <path>` /
# $MINDEX_INDEXER_CONFIG. Every key is OPTIONAL: omitted keys use the built-in
# default. CLI flags override the file; the file overrides the defaults. The
# indexer reports (on stderr) which file it used and every value a flag overrode.
#
# Only the operational knobs live here. Per-invocation arguments (--project,
# --root, --include/--exclude, --check, --json, --verbose) are flags only.

server_url = "https://127.0.0.1:11111" # mindex server
protocol = "v0"                        # API version embedded in the URL path
batch_size_files = 100                 # files per upload batch (one HTTP request each)
# concurrency = 4                      # parallel upload streams; omit to default to
                                       # min(logical CPUs, 4). Keep <= the server's
                                       # [database].pool_size or batches hit PoolEmpty.
no_verify = false                      # skip TLS verification (needed for the default
                                       # self-signed cert). --no-verify can only turn this on.
# ca_cert = "/path/to/rootCA.pem"      # extra CA to trust, on top of the OS store. Only
                                       # needed when the server's CA is NOT installed
                                       # system-wide; mkcert and corporate roots usually are.
                                       # Prefer this over no_verify: it still verifies.

# --- authorization -------------------------------------------------------
# The bearer token for a server running with [auth].enabled. It is the only
# credential mindex checks; each one names the projects it reaches and the
# actions it permits. Mint one on the server's host:
#     mindex mint-token --sub cli@$(hostname) --project '*' \
#       --can search,index,delete --for cli --days 90
# `--for` is optional; it labels which kind of client the token is for, and this
# one refuses to run with a token labelled for another (the server checks nothing).
# token = "eyJhbGciOi..."          # prefer NOT to put it here, see below
#
# Four sources, first one wins: --token, $MINDEX_TOKEN, $MINDEX_TOKEN_FILE (a
# 0600 file holding it), this key, then a per-server entry in
# ~/.config/mindex/credentials.toml:
#     ["https://127.0.0.1:11111"]
#     token = "eyJhbGciOi..."
# The credentials file is the better home for a long-lived credential: it is
# keyed by server URL, so one machine can hold several, and it refuses to be
# read at all unless it is mode 0600 — which this file is not held to.

# --- git history (the second content channel) -----------------------------
# Off by default. When on, each run also reconciles the project's commit history:
# the client posts the commits reachable from git_refs within the window below,
# and the server inserts what it lacks and drops what was not named. A sha is its
# own content hash, so a force-push or a rebase needs no special handling — it is
# one reconciliation in which many shas orphan at once.
history = false                        # --history / --no-history
# git_refs = ["HEAD"]                  # ref PATTERNS bounding the walk, e.g.
                                       # ["master", "dev", "feat/*"]. .mindex's
                                       # git_refs overrides this; --git-ref
                                       # overrides both (it replaces, never extends).
history_max_age_days = 730             # --history-since-days; omit for no age bound
history_max_commits = 5000             # --history-max-commits; applied together with
                                       # the age bound, stricter one binds
history_min_message_bytes = 40         # drop commits whose whole message is shorter
                                       # ("wip", "fix", "."): no information, but they
                                       # still occupy a file_history slot

# ---------------------------------------------------------------------------
# Gold-set construction. PROTOCOL.md §3.2.
# ---------------------------------------------------------------------------

[qrels]
# The query source differs by dataset family, and getting it wrong is the
# easiest way to fake a good score:
#
#   swebench_like   `problem_statement` — the issue title and body.
#                   `hints_text` is EXCLUDED: it holds pull-request review
#                   comments written after the fix, which routinely name the
#                   file to change.
#
#   multi_swebench  `resolved_issues[].title` + `.body` — the linked issue.
#                   NOT the record's own `title`/`body`: those belong to the
#                   pull request and describe the fix that was made. One
#                   ripgrep PR title reads "replace clap with lexopt", which
#                   would hand the answer to any retriever.
query_field_swebench_like = "problem_statement"
query_field_multi_swebench = "resolved_issues"

# A test file is where a bug is demonstrated, not where it lives. Applied
# uniformly to every system and baseline.
exclude_test_paths = [
    "**/test_*.py", "**/*_test.py", "**/tests/**", "**/test/**",
    "**/*_test.go", "**/*_test.rs", "**/tests.rs",
    "**/*.test.ts", "**/*.test.js", "**/*.spec.ts", "**/*.spec.js",
    "**/__tests__/**", "**/spec/**",
    "**/src/test/**", "**/*Test.java", "**/*Tests.java",
]

# A changelog entry is where a fix is ANNOUNCED, not where it lives — the same
# argument that excludes tests. Measured on ripgrep: 3 of 14 instances carried
# one, and a system ranking CHANGELOG.md first would have scored a hit for
# "localizing" the bug. Deliberately narrow: it covers records of change, not
# documentation. `doc/rg.1.md` stays gold, because a man page describing a flag
# genuinely is part of the change surface.
exclude_record_paths = [
    "**/CHANGELOG*", "**/CHANGES*", "**/HISTORY*", "**/NEWS*",
    "**/RELEASE*", "**/AUTHORS*", "**/CONTRIBUTORS*",
    "**/COPYING*", "**/LICENSE*", "**/NOTICE*",
]

# NOTE for anyone editing the two lists above: they are matched with
# PurePosixPath.full_match (Python 3.13+), NOT fnmatch. fnmatch is not
# path-aware, so `**/tests/**` there fails to match a ROOT-level `tests/` —
# which is exactly where django keeps its suite. See build_qrels.py
# `path_matches` and `--self-test`.

# Instances with an empty gold set after the exclusions are dropped; the count
# is published rather than absorbed.
drop_empty_gold = true

# A query longer than this cannot be served AT ALL, and the bound belongs to the
# vector store rather than to mindex: ColBERT emits one 1024-wide row per query
# token, a Qdrant multivector holds at most 1 048 576 elements, so 1024 rows is
# already one too many. Measured 2026-08-04 — such a query returns 503
# `qdrant.unavailable` whatever its length, because the embedder's own --maxlen
# truncation still leaves more rows than the store accepts. mindex derives
# STORABLE_TOKENS_CEILING from the same constant and documents it as
# "structural, not configurable, like VECTOR_DIM".
#
# 1023, not 1024: the store's check is `<`, so exactly 1024 rows fails.
#
# These instances are DROPPED from the corpus (PROTOCOL §4.2 and the amendment
# in §11), counted, and published. The reason it is an exclusion rather than a
# zero: the BM25/FTS5 floor in family F1 accepts a query of any length, so
# scoring mindex zero here would charge it for a vector-store constraint no
# baseline pays, in the one comparison that is meant to be about retrieval.
# --keep-over-limit-queries builds the other corpus for anyone who disagrees.
max_query_tokens = 1023
tokenizer_model = "BAAI/bge-m3"

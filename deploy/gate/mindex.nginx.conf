# Reference gateway for a mindex deployment reachable from outside the host.
#
# WHY THIS FILE IS IN THE REPOSITORY
#
# It is the deployment's outer security boundary, and it was unversioned: the
# server's own documentation described a gateway nobody could read. What is below
# is load-bearing enough that getting it wrong is silent, so it is written down
# where it can be reviewed alongside the code that assumes it.
#
# ONE CREDENTIAL, AND WHY THE SECOND ONE WAS REMOVED
#
# Every request carries a bearer token minted by mindex. This gateway checks that
# one is *present*; mindex checks that it is *valid*, which projects it reaches
# and which actions it permits.
#
# There used to be a second credential here — a shared `X-Api-Key` this file
# validated and mindex ignored — and it is gone rather than made optional. It had
# no scope, no expiry and no way to be revoked short of rotating it for every
# caller at once, so as a security layer it added a string; and its real cost was
# elsewhere. The whole point of the token is that it can be handed to an agent,
# and a deployment that also demanded the API key put that shared secret back
# into the model's context — the exact problem the token was introduced to
# remove. Two credentials where one is strictly stronger is not defence in depth,
# it is the weaker one setting the floor.
#
# nginx cannot verify the signature (that needs nginx-plus or a Lua module), and
# it does not need to: an unsigned, expired or under-scoped token gets past the
# map below and is refused by mindex with a 401 or a 403. What this map decides
# is only *which* callers are allowed to reach mindex's own check — it turns away
# the internet's background scanning without pretending to be the authorization.
#
# CONSEQUENCE FOR THE SERVER BEHIND IT: this gateway is no longer a credential
# check of any kind, so `[auth].enabled = true` is mandatory for any deployment
# reachable through it. With authorization off, a caller sending the literal
# header `Authorization: Bearer x` is admitted here and served everything.

# Present and shaped like a bearer token. Deliberately not a validity check —
# see above; mindex owns that. `~*` because RFC 7235 makes the scheme
# case-insensitive and clients spell it three ways.
map $http_authorization $mindex_allowed {
    default           0;
    "~*^Bearer\s+\S+" 1;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mindex.example;

    ssl_certificate     /etc/ssl/mindex/fullchain.pem;
    ssl_certificate_key /etc/ssl/mindex/privkey.pem;

    # Closed with no status line rather than 401, which is why mindex's own
    # `/llms.txt` warns that an empty reply from this host means credentials far
    # more often than it means the server is down. `444` is nginx's non-standard
    # "close without responding" — it gives a scanner nothing to work with.
    if ($mindex_allowed = 0) {
        return 444;
    }

    location / {
        # The upstream is loopback-only. mindex trusts whatever reaches it, so
        # anything that can open this socket can act as any caller this gateway
        # would have allowed — binding it to an interface would put that
        # decision on the network instead of on this file.
        proxy_pass https://127.0.0.1:11111;

        # The private CA that issued the upstream's certificate. mindex speaks
        # TLS on loopback too, and turning verification off here would make this
        # gateway the one hop that does not check.
        proxy_ssl_trusted_certificate /etc/ssl/mindex/ca.pem;
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;

        # `Authorization` passes through untouched — it is the credential mindex
        # itself reads, and this gateway must not rewrite, strip or supply it. A
        # request is then byte-identical whether it arrived through here or
        # directly at the loopback socket, which is what keeps the two paths
        # debuggable against each other.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Research is a long-lived one-way SSE stream: a `high` run may hold the
        # connection for seventy minutes, and the default 60s read timeout would
        # cut it at the first quiet moment between events. Buffering must be off
        # for the same reason — the whole value of these two endpoints is that
        # their output is watched as it arrives.
        proxy_buffering    off;
        proxy_read_timeout 4200s;
        proxy_send_timeout 4200s;
        chunked_transfer_encoding on;

        # Indexing bodies carry file contents; the server's own cap is
        # `[server].max_body_mib` (256 MiB by default). A lower value here fails
        # the request with an nginx error page rather than mindex's problem+json,
        # so keep the two in step.
        client_max_body_size 256m;
    }

    # Operator surfaces are not published at all, rather than resting on the
    # `admin` action alone. `/metrics` carries per-project labels and counts, and
    # a scraper belongs on the host beside the server — see docs/claude/auth.md
    # for the bearer token a local VictoriaMetrics needs once [auth] is on.
    location /metrics { return 404; }
    location /status  { return 404; }
    location /gc      { return 404; }
}

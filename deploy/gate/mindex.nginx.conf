# Reference gateway for a mindex deployment reachable from outside the host.
#
# WHY THIS FILE IS IN THE REPOSITORY
#
# It is the deployment's outer security boundary, and it was unversioned: the
# server's own documentation described a gateway nobody could read. What is below
# is load-bearing enough that getting it wrong is silent, so it is written down
# where it can be reviewed alongside the code that assumes it.
#
# ONE CREDENTIAL, AND WHY THE SECOND ONE WAS REMOVED
#
# Every request carries a bearer token minted by mindex. This gateway checks that
# one is *present*; mindex checks that it is *valid*, which projects it reaches
# and which actions it permits.
#
# There used to be a second credential here — a shared `X-Api-Key` this file
# validated and mindex ignored — and it is gone rather than made optional. It had
# no scope, no expiry and no way to be revoked short of rotating it for every
# caller at once, so as a security layer it added a string; and its real cost was
# elsewhere. The whole point of the token is that it can be handed to an agent,
# and a deployment that also demanded the API key put that shared secret back
# into the model's context — the exact problem the token was introduced to
# remove. Two credentials where one is strictly stronger is not defence in depth,
# it is the weaker one setting the floor.
#
# nginx cannot verify the signature (that needs nginx-plus or a Lua module), and
# it does not need to: an unsigned, expired or under-scoped token gets past the
# map below and is refused by mindex with a 401 or a 403. What this map decides
# is only *which* callers are allowed to reach mindex's own check — it turns away
# the internet's background scanning without pretending to be the authorization.
#
# CONSEQUENCE FOR THE SERVER BEHIND IT: this gateway is no longer a credential
# check of any kind, so `[auth].enabled = true` is mandatory for any deployment
# reachable through it. With authorization off, a caller sending the literal
# header `Authorization: Bearer x` is admitted here and served everything.

# Present and shaped like a bearer token. Deliberately not a validity check —
# see above; mindex owns that. `~*` because RFC 7235 makes the scheme
# case-insensitive and clients spell it three ways, and `\S+` is what stops a
# bare `Bearer` (or `Bearer ` with nothing after it) from being admitted.
map $http_authorization $mindex_key_ok {
    default           0;
    "~*^Bearer\s+\S+" 1;
}

# THE KEYLESS SET IS mindex's OWN, NOT A SUBSET OF IT (2026-08-04).
#
# It was GET /llms.txt alone, and that made this gate contradict the server
# behind it. mindex's ROUTE_POLICY marks five routes RoutePolicy::Public, each
# with a reason written next to it: /health and /version are liveness, because a
# probe that needs a credential reports the credential's health and not the
# server's; /config, /llms.txt and the descriptor are discovery, and a discovery
# document behind a credential cannot be discovered.
#
# Closing four of those five here did not add security — it moved the refusal
# from the server, which answers 200 to them by design, to a gate that answers
# nothing at all. The cost landed exactly on the well-behaved: measured over
# three hours on 2026-08-04, ONE configured client produced 840 closed
# connections on GET /health, a poll that is supposed to be creditless, while its
# genuinely credentialed calls to /status and /projects were answered 401 by
# mindex as they should be. An agent following /llms.txt to /config met the same
# wall, and the ban that followed was earned entirely by doing what the document
# it had just read told it to do.
#
# So the list below IS ROUTE_POLICY's public set. If a route is added there, add
# it here; a route public in the server and closed in the gate is a contradiction
# that presents as an outage, never as a refusal.
#
# ONE DELIBERATE DIVERGENCE: mindex also treats /swagger-ui and /api-docs/ as
# public, and those stay closed here. The server's argument is about
# authorization — a specification behind a credential cannot be read by someone
# deciding whether to ask for one — and it is right at its own boundary. This
# gate's concern is the exposure surface facing the internet, and those two are a
# megabyte of vendored browser JavaScript rather than static prose. The
# descriptor already inventories every endpoint, so nothing an agent needs to
# bootstrap is behind them.
map "$mindex_key_ok:$request_method:$uri" $mindex_allow {
    default                             0;
    "~^1:"                              1;   # any request carrying a token-shaped header
    # Keyless: exactly the five routes mindex itself answers without a
    # credential, and only the two safe methods. HEAD is included because a
    # client that probes with it before fetching would otherwise meet the very
    # "empty reply from a host that may be dead" this whole exception exists to
    # remove.
    #
    # What it currently gets is 403, not 200: mindex's ROUTE_POLICY names only
    # GET for these five, and enforce_route_policy fails closed on a routed path
    # with no row. That is deliberate on this side — the gate admits, the server
    # decides — and 403 still answers the question a HEAD prober is asking, which
    # 444 never did. Serving HEAD properly is a change to ROUTE_POLICY (five
    # rows, plus its exhaustiveness guards), not to this file.
    #
    # $uri is the normalized path with the query string already stripped, so
    # the anchors are exact: /config?x=1 matches, /configuration does not.
    "~^0:(?:GET|HEAD):/(?:llms\.txt|config|health|version|\.well-known/mindex\.json)$"  1;
}

# ── fail2ban's ban list, applied here rather than at the firewall ────────────
#
# Behind a tunnel every packet arrives from the forwarder's address and the real
# client only exists inside the PROXY protocol header, so a firewall rule could
# ban only the tunnel — i.e. everyone. Hence a map file the ban action appends
# `<ip> 1;` lines to.
#
#   map $remote_addr $mindex_banned { default 0; include /path/blocked.map; }
#
# THE ORDER OF THE TWO CHECKS IS LOAD-BEARING, and getting it wrong is what took
# this deployment down on 2026-08-04. They were two separate `if`s with the ban
# tested first, so a ban also closed /llms.txt. A browser then demonstrated the
# consequence: it fetched the published document, asked for /favicon.ico nine
# times as browsers do, tripped the jail on those 444s, and the resulting ban
# swallowed the document itself. The caller the keyless exception exists for was
# the one it locked out — and from outside, an empty reply is indistinguishable
# from a dead host, so the deployment read as broken rather than as banning.
#
# The rule below is: a ban closes everything a token would have opened, and
# never the public surface. It needs no list of public URIs, because
# `allow=1 with key_ok=0` IS that surface by construction — one fewer copy to
# keep in step.
#
#   allow : banned : key_ok
#     1   :   0    :   0     public document, not banned   → serve
#     1   :   0    :   1     credentialed, not banned      → serve
#     1   :   1    :   0     public document, banned       → serve
#     1   :   1    :   1     credentialed, banned          → refuse
#     0   :   *    :   *     never admitted                → refuse
map "$mindex_allow:$mindex_banned:$mindex_key_ok" $mindex_refuse {
    default 1;
    "1:0:0" 0;
    "1:0:1" 0;
    "1:1:0" 0;
}

# The jail that feeds $mindex_banned lives in fail2ban-jail.mindex-nginx.conf
# beside this file, and its filter — which MUST exempt the keyless surface, or
# reading the public document is what gets a caller banned — in
# fail2ban-filter.mindex-nginx.conf.

# MIGRATING AN EXISTING GATE, in the order that has no open window.
#
# Turn `[auth].enabled = true` on the server FIRST, then switch this map. While
# mindex checked nothing, the API key was the only thing guarding the remote
# path, so retiring it first would leave a period in which nothing checked
# anything; retiring it afterwards merely drops a credential mindex has already
# made redundant. Nothing breaks at the second step that the first step did not
# already break — a caller holding only the old key is refused by mindex the
# moment authorization comes on, whatever this file says.
#
# One trap found doing exactly this: if the deciding variable is named in
# `log_format`, a log exporter and its dashboard panels are reading that field by
# name. Change what feeds the variable, not what it is called — renaming it to
# match its new meaning blanks a panel silently, which is worse than a name that
# is one word out of date.

server {
    listen 443 ssl;
    http2 on;
    server_name mindex.example;

    ssl_certificate     /etc/ssl/mindex/fullchain.pem;
    ssl_certificate_key /etc/ssl/mindex/privkey.pem;

    # Closed with no status line rather than 401, which is why mindex's own
    # `/llms.txt` warns that an empty reply from this host means credentials far
    # more often than it means the server is down. `444` is nginx's non-standard
    # "close without responding" — it gives a scanner nothing to work with.
    #
    # ONE decision, not two: see $mindex_refuse above for why the ban check and
    # the admission check must not be separate `if`s.
    if ($mindex_refuse) {
        return 444;
    }

    location / {
        # The upstream is loopback-only. mindex trusts whatever reaches it, so
        # anything that can open this socket can act as any caller this gateway
        # would have allowed — binding it to an interface would put that
        # decision on the network instead of on this file.
        proxy_pass https://127.0.0.1:11111;

        # The private CA that issued the upstream's certificate. mindex speaks
        # TLS on loopback too, and turning verification off here would make this
        # gateway the one hop that does not check.
        proxy_ssl_trusted_certificate /etc/ssl/mindex/ca.pem;
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;

        # `Authorization` passes through untouched — it is the credential mindex
        # itself reads, and this gateway must not rewrite, strip or supply it. A
        # request is then byte-identical whether it arrived through here or
        # directly at the loopback socket, which is what keeps the two paths
        # debuggable against each other.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Research is a long-lived one-way SSE stream: a `high` run may hold the
        # connection for seventy minutes, and the default 60s read timeout would
        # cut it at the first quiet moment between events. Buffering must be off
        # for the same reason — the whole value of these two endpoints is that
        # their output is watched as it arrives.
        proxy_buffering    off;
        proxy_read_timeout 4200s;
        proxy_send_timeout 4200s;
        chunked_transfer_encoding on;

        # Indexing bodies carry file contents; the server's own cap is
        # `[server].max_body_mib` (256 MiB by default). A lower value here fails
        # the request with an nginx error page rather than mindex's problem+json,
        # so keep the two in step.
        client_max_body_size 256m;
    }

    # Operator surfaces are not published at all, rather than resting on the
    # `admin` action alone. `/metrics` carries per-project labels and counts, and
    # a scraper belongs on the host beside the server — see docs/claude/auth.md
    # for the bearer token a local VictoriaMetrics needs once [auth] is on.
    location /metrics { return 404; }
    location /status  { return 404; }
    location /gc      { return 404; }
}

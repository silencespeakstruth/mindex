# Reads the mindex gate's JSON access log.
#
# 444 = the gate closed the connection: no Bearer-shaped Authorization header, a
# method other than GET/POST/DELETE, or an already-banned address. Every client
# of this deployment holds a token, so a 444 outside the public surface below is
# a probe; maxretry only decides how patient we are.
# 429 = an authenticated client past its rate limit — kept in as a stolen-token
# signal, not because normal use reaches it.
#
# NB: the regex deliberately does NOT anchor at "^{\"ts\"...". fail2ban strips
# the text matched by `datepattern` out of the line before applying failregex,
# so any anchor that reaches through the timestamp can never match — the
# symptom is "date template hits" counting up while "Failregex: 0 total".

[Definition]

failregex = "remote_addr":"<ADDR>",.*"status":(?:444|429),
            "remote_addr":"<ADDR>",.*"status":401,"key_ok":0,

# THE SECOND LINE MUST KEEP THAT key_ok:0, and it is the whole reason the field
# is in log_format. Since the refusal was split, a keyless request to a real
# endpoint gets 401 from the GATEWAY instead of 444 — same probe, now with a
# hint attached — so it has to stay bannable or the split would have disarmed
# the jail on every route worth probing.
#
# But mindex issues 401 and 403 of its own, for a token that is real and expired,
# or real and scoped to another project. Those carry key_ok:1, and they are the
# signature of a client to re-credential, not an attacker to ban: banning them
# turns one misconfigured editor into an outage that also swallows its own
# /health. The two are distinguishable only by this field, because the status is
# identical and the body is not logged.

# THE PUBLIC SURFACE IS EXEMPT, and this is not a courtesy — without it the gate
# bans the callers it was opened for.
#
# The rule above rests on "a legitimate client never produces a 444", which was
# true while nothing at all was served without a credential. Opening GET
# /llms.txt (see nginx's 00-mindex-api-keys.conf) created the opposite kind of
# client: one that legitimately arrives with NO token, and therefore cannot be
# expected to confine itself to the single URI the map admits.
#
# A browser is the case that proved it. Fetching /llms.txt costs one 200 and
# then NINE 444s, because the browser asks for /favicon.ico and Firefox retries
# it — nine tenths of maxretry spent by a client that did exactly what the
# document invites. Observed 2026-08-04: one visit to the published URL banned
# the author's own address for 24h, and the ban then also swallowed /llms.txt,
# since $mindex_banned is tested BEFORE the keyless exception. The document
# exists to tell an unauthenticated caller that it needs a token; reading it
# must not be what gets that caller blocked.
#
# The set is mindex's own RoutePolicy::Public list plus the two URIs a client
# fetches without being told to (/favicon.ico by every browser, /robots.txt by
# every crawler). It must stay equal to the nginx $mindex_allow keyless list:
# there, a public route missing from the list is refused; here, a public route
# missing from the list is refused AND the caller is banned for asking. Measured
# over three hours on 2026-08-04, one configured client produced 840 closed
# connections on the creditless GET /health alone.
#
# Scope is deliberately these literal URIs and no pattern. It buys an
# attacker two endpoints that cost a TLS handshake and are answered with 444 in
# nginx's rewrite phase — no upstream, no work — still bounded by limit_conn
# (16 connections per address) and by the VPS-side limit_conn. Anything else
# keyless remains a bannable probe, which is the whole point of the migration
# these lines accompany.
#
# $uri is the normalized path with the query string already stripped, so the
# trailing comma is what pins the field's end: /llms.txt.php does not match.
ignoreregex = "uri":"/(?:llms\.txt|favicon\.ico|robots\.txt|config|health|version|\.well-known/mindex\.json)",

datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S%%z"

journalmatch =

# Bans repeat probers of the mindex gate.
#
# NOT a firewall ban: every packet arrives from 10.8.0.1 (the VPS forwarder)
# and the real source only exists inside the PROXY protocol header, so a
# firewalld rule could only ban the tunnel itself. nginx-block-map appends the
# offender to a map nginx consults on every request instead.

[mindex-nginx]
enabled  = true
filter   = mindex-nginx
logpath  = /var/log/nginx/mindex-access.log
backend  = polling

port     = 443
protocol = tcp

maxretry = 10
findtime = 10m
bantime  = 24h

bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 30d

# Do not ban ourselves or the tunnel plumbing while testing.
ignoreip = 127.0.0.1/8 ::1 10.8.0.1 10.8.0.2

action = nginx-block-map[blck_lst_file="/etc/nginx/mindex-blocked.map"]
